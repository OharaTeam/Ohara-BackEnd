# ========================================================
# OHARA BACK-END - AMBIENTE DE DESENVOLVIMENTO LOCAL
# ========================================================
# Este arquivo sobe apenas os serviços de infraestrutura necessários
# para o desenvolvimento local (PostgreSQL).
# Para iniciar o banco de dados:
#   docker compose up -d
# Para parar:
#   docker compose down
#
# Para deploy em produção (VPS), utilize: docker-compose.prod.yml
# ========================================================

services:
  postgres:
    image: postgres:16-alpine
    container_name: ohara-postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: ${DB_USER:-ohara}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-docker}
      POSTGRES_DB: ${DB_NAME:-ohara_db}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-ohara} -d $${POSTGRES_DB:-ohara_db}" ]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
